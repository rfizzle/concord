# Concord — template & file propagation.
#
# Runs per release channel (see workflow-stubs.json). A push to master targets
# the canary members whose canary ref is master; a push to stable (the ref
# `make promote` fast-forwards) targets every member not in the canary map, plus
# the packs for site rebuilds. Any other ref targets nothing. The run checks out
# the ref that triggered it, so a member gets its propagated files, skills and
# the build kit from the same hub ref its workflows run.
#
# Three propagation mechanisms, one workflow:
#
#   1. Site rebuilds — when the shared site template (or the member registry)
#      changes, dispatch a `concord-template-updated` event to the channel's
#      member repos (and, on stable, the pack repos) so their sites pick up the
#      change within minutes. Nothing is committed to those repos; their site
#      workflows rebuild against the channel's hub ref (concord-ref).
#
#   2. File sync (PR-based) — concord-owned payloads are proposed to every member
#      via a single `concord-sync` pull request, because member default branches
#      are protected and reject direct commits. Each run stages onto the branch:
#        - everything under propagate/ (e.g. .github/ISSUE_TEMPLATE/*.yml and
#          versions-common.properties, the suite toolchain pins) at the same
#          relative path (including concord.mk, the shared build kit) — only
#          wholly concord-owned files belong here; files a repo customizes
#          (its Makefile, which includes concord.mk) stay repo-owned;
#        - the <!-- concord:NAME:start/end --> regions of AGENTS.md (from
#          AGENTS-COMMON.md) and .gitignore (from gitignore-common); repo-owned
#          text outside the markers is untouched, and a member with no markers
#          yet is left alone — seeding is the opt-in;
#        - the vendored .ai/skills/, .ai/commands/ and .ai/agents/ trees, mirroring `make
#          sync` (rsync -a --delete): concord-dropped files are removed from the
#          member and .ai/skills/.concord-rev records the source concord commit.
#      The branch is reset to the default head each run, so the PR diff is exactly
#      concord's desired changes; with nothing to change, no PR is opened. Logic
#      lives in scripts/open-sync-pr.py.
#
#   3. Issue labels — the shared label taxonomy (labels.json) is reconciled onto
#      every member via the labels API: missing labels created, drifted
#      color/description updated in place, unlisted labels (dependabot's or any
#      repo-local one) left untouched. Nothing is committed and no
#      PR is opened — labels are GitHub-side config, not tracked files. Logic
#      lives in scripts/sync-labels.py.
#
# Requires a repo secret CONCORD_DISPATCH_TOKEN. Without it the workflow fails
# gracefully per-repo.
#
# Use the LEAST-PRIVILEGED credential that works — this token can write to every
# member repo, so its blast radius if leaked is the whole suite:
#   1. Preferred: a GitHub App installed on the member repos, minting a
#      short-lived installation token per run (Contents RW, Pull requests RW,
#      Issues RW, Actions write). Short TTL + per-repo scoping beats a standing
#      secret.
#   2. Otherwise: a FINE-GRAINED PAT scoped to exactly the member repos with
#      Contents RW, Pull requests RW, Issues RW, Actions write, AND an expiry set
#      (rotate on schedule).
# Do NOT use a classic `repo`-scoped PAT: it grants far more than needed across
# every repo the owner can touch and never expires.
name: Propagate template to member sites

on:
  push:
    branches: [master, stable]
    paths:
      - "template/**"
      - "members.json"
      - "propagate/**"
      - "AGENTS-COMMON.md"
      - "gitignore-common"
      - ".ai/skills/**"
      - ".ai/commands/**"
      - ".ai/agents/**"
      - "propagate/scripts/**"
      - "labels.json"
      - "scripts/inject-agents-regions.py"
      - "scripts/open-sync-pr.py"
      - "scripts/sync-labels.py"
      - "workflow-stubs.json"
  workflow_dispatch:

jobs:
  members:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        # repos = file-sync targets: the channel's members only. A pack is not a
        #   Fabric mod, so the AGENTS.md regions and propagate/ files do not
        #   apply to it.
        #   master -> members whose canary ref is master
        #   stable -> members not in the canary map
        #   other  -> none
        # sites = site-rebuild targets: the channel's members, plus the packs on
        #   stable. A pack ships a template-built site too, so it must rebuild on
        #   template/registry changes even though it takes no file sync.
        env:
          REF: ${{ github.ref_name }}
        run: |
          canary=$(jq -c '.canary' workflow-stubs.json)
          repos=$(jq -c --arg ref "$REF" --argjson canary "$canary" '
            [.members[].id] as $all
            | if $ref == "master" then [$all[] | select($canary[.] == "master")]
              elif $ref == "stable" then [$all[] | select($canary[.] == null)]
              else [] end' members.json)
          if [ "$REF" = "stable" ]; then
            sites=$(jq -c --argjson repos "$repos" '$repos + [.packs[].id]' members.json)
          else
            sites=$repos
          fi
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

  # A matrix over [] is an error, so each matrix job skips on an empty list.
  dispatch:
    needs: members
    if: needs.members.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.members.outputs.sites) }}
    steps:
      - name: Dispatch rebuild to rfizzle/${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.CONCORD_DISPATCH_TOKEN }}
        run: |
          gh api "repos/rfizzle/${{ matrix.repo }}/dispatches" \
            -f event_type=concord-template-updated \
            || echo "::warning::could not dispatch to rfizzle/${{ matrix.repo }} (repo missing site workflow or token lacks access)"

  sync-pr:
    needs: members
    if: needs.members.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.members.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Propose concord-owned files to rfizzle/${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.CONCORD_DISPATCH_TOKEN }}
        run: python3 scripts/open-sync-pr.py "rfizzle/${{ matrix.repo }}"

  labels:
    needs: members
    if: needs.members.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.members.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconcile shared labels on rfizzle/${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.CONCORD_DISPATCH_TOKEN }}
        run: python3 scripts/sync-labels.py "rfizzle/${{ matrix.repo }}"
