# Concord — reusable CI for member mods.
#
# One job, because coverage is measured across both sweeps: the unit tests and
# the gametests each drop a JaCoCo exec file, and `jacocoMergedReport` merges
# them into the mod's real coverage number. Split across two runners the exec
# files never coexist, so the sweeps share a job. Caller stub:
#
#   name: CI
#   on:
#     push: { branches: [master] }
#     pull_request: { branches: [master] }
#   permissions:
#     contents: read
#     checks: write
#     pull-requests: write
#   jobs:
#     ci:
#       uses: rfizzle/concord/.github/workflows/mod-ci.yml@stable
#       secrets: inherit
#
# The hub files this workflow checks out load from the `concord-ref` input
# (default stable). The canary stub calls @master and passes
# `concord-ref: master`, so the workflow and the hub files it loads come from
# the same ref.
#
# CI contract (every member repo's gradle must provide):
#   ./gradlew build runGametest jacocoMergedReport
#   merged coverage xml at
#     build/reports/jacoco/jacocoMergedReport/jacocoMergedReport.xml
#   junit xml at build/test-results/test/ and build/junit-gametest.xml
#
# Also required:
#   ./gradlew verifyDatagenIdempotent
name: Mod CI

on:
  workflow_call:
    inputs:
      concord-ref:
        description: "concord ref to load the shared check scripts and members.json from (stable by default; the canary stub passes master)"
        type: string
        default: stable

jobs:
  test:
    runs-on: ubuntu-latest
    # Only reads the repo and uploads artifacts. The caller stub grants
    # checks/pull-requests write, which this job never uses — cap it here so
    # an over-broad stub can't widen this reusable workflow's token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The listing check asks `git tag --list v*` whether this mod has ever
          # shipped. A default checkout fetches no tags, so that question would
          # answer "never released" in every repo and the stale-banner rule
          # would pass by never running — the same shape as a datagen check
          # pointed at a directory that does not exist. Tags, depth 1.
          fetch-tags: true

      # The hub carries members.json (store slugs, taglines) and the shared
      # check scripts. mod-release.yml already checks concord out this way; this
      # is the same checkout, and concord#46's art-repeatability step will want
      # it too rather than adding a second one.
      - name: Check out concord
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfizzle/concord
          ref: ${{ inputs.concord-ref }}
          path: .concord

      # Fails on a store listing that claims an integration the code does not
      # have, omits a registered block, or still tells players a shipped mod is
      # unreleased. Every one of those was found live on a published page.
      - name: Check the store listing against what the mod ships
        run: python3 .concord/scripts/check-listing-claims.py --members-file .concord/members.json

      - name: Verify art and audio match their specs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 .ai/skills/mc-textures/scripts/glyph.py --verify-all
          python3 .ai/skills/mc-audio/scripts/sfx.py --verify-all

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (compile + unit tests + jar)
        run: ./gradlew build --no-daemon --stacktrace --warning-mode=all

      - name: Run gametests
        run: ./gradlew runGametest --no-daemon --stacktrace --warning-mode=all

      # dependsOn runDatagen, which forks a Minecraft server.
      - name: Verify datagen is idempotent
        run: ./gradlew verifyDatagenIdempotent --no-daemon --stacktrace

      # always(), so a failed sweep still publishes what coverage it has. The
      # task itself warns when an exec file is missing or empty, so a partial
      # number can't pass itself off as merged.
      - name: Merged coverage report (unit + gametest)
        if: always()
        run: ./gradlew jacocoMergedReport --no-daemon --stacktrace

      # The report-level counters are the last <counter> elements of <report>.
      - name: Coverage summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = "build/reports/jacoco/jacocoMergedReport/jacocoMergedReport.xml"
          print("### Merged coverage (unit + gametest)")
          if not os.path.exists(path):
              print("No merged JaCoCo report was produced.")
          else:
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}
              for kind in ("LINE", "BRANCH"):
                  c = counters.get(kind)
                  if c is None:
                      continue
                  covered, missed = int(c.get("covered")), int(c.get("missed"))
                  total = covered + missed
                  pct = 100.0 * covered / total if total else 0.0
                  print(f"- {kind.title()}: {pct:.1f}% ({covered}/{total})")
          PY

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload gametest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gametest-report
          path: |
            build/gametest/
            build/junit-gametest.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoMergedReport/
          retention-days: 7
          if-no-files-found: ignore
