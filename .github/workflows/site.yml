# Builds the Concord landing site from site/ content using the shared template
# in this repo (template/) and deploys it to GitHub Pages.
#
# Pages source must be set to "GitHub Actions" in this repo's settings.
# Rebuilds fire on content changes, on template/members.json changes (which
# also affect this site's footer), on demand, and nightly: the build runs
# scripts/gen-status.py first, so the status page's release, CI, download and
# issue data is fetched fresh from the public GitHub and Modrinth APIs on every
# deploy and never committed. The generator degrades to dashes when an API is
# unreachable. It needs no secrets; the job token only raises the rate limit.
name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "template/**"
      - "members.json"
      - ".github/workflows/site.yml"
      - ".github/workflows/build-site.yml"
      - "scripts/gen-status.py"
  schedule:
    - cron: "43 5 * * *" # daily, 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    uses: ./.github/workflows/build-site.yml
    with:
      # The hub's own site builds with the commit being pushed, not stable.
      concord-ref: ${{ github.sha }}
      prebuild: python3 scripts/gen-status.py
